<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore the complete fashion library from THE FASHION HUB." />
    <title>THE FASHION HUB | Fashion Library</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="chat-bot.css" />
    <script src="script.js" defer></script>
    <script src="chat-bot.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <a class="brand" href="index.html"><img class="brand-logo" src="logo.svg" alt="THE FASHION HUB" /></a>

        <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>

        <nav class="nav-menu" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="collections.html">Collections</a>
          <a class="active" href="images.html">Fashion Library</a>
          <a href="about.html">About</a>
          <a href="about.html#contact">Contact</a>
        </nav>

        <a class="btn btn-primary header-btn" href="about.html#contact">Book a consult</a>
      </div>
    </header>

    <main>
      <section class="library-banner">
        <div class="container library-banner-inner reveal">
          <div>
            <div class="eyebrow">Curated collection</div>
            <h1>FASHION LIBRARY</h1>
            <p>Explore our complete collection of fashion designs.</p>
          </div>
        </div>
      </section>

      <section class="section library-panel">
        <div class="container">
          <div class="library-toolbar reveal">
            <div class="search-wrap">
              <input id="searchInput" type="search" placeholder="Search fashion..." aria-label="Search fashion" />
            </div>

            <div class="filter-bar filter-bar--library" id="filterBar">
              <button class="filter-btn is-active" data-filter="all" type="button">All</button>
              <button class="filter-btn" data-filter="men" type="button">Men's Fashion</button>
              <button class="filter-btn" data-filter="women" type="button">Women's Fashion</button>
              <button class="filter-btn" data-filter="dresses" type="button">Dresses</button>
              <button class="filter-btn" data-filter="suits" type="button">Suits</button>
              <button class="filter-btn" data-filter="streetwear" type="button">Streetwear</button>
              <button class="filter-btn" data-filter="jackets" type="button">Jackets</button>
              <button class="filter-btn" data-filter="shoes" type="button">Shoes</button>
              <button class="filter-btn" data-filter="accessories" type="button">Accessories</button>
            </div>
          </div>

          <div id="fashionGrid" class="fashion-grid" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <div class="image-modal" id="imageModal" aria-hidden="true">
      <div class="modal-backdrop" data-close="true"></div>
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modal-close" id="modalClose" type="button" aria-label="Close modal">×</button>
        <button class="modal-nav modal-prev" id="prevBtn" type="button" aria-label="Previous item">‹</button>
        <button class="modal-nav modal-next" id="nextBtn" type="button" aria-label="Next item">›</button>
        <div class="modal-image-wrap">
          <img id="modalImage" src="" alt="" />
        </div>
        <div class="modal-copy">
          <div class="eyebrow" id="modalCategory">Category</div>
          <h2 id="modalTitle">Product name</h2>
          <p id="modalDescription">Description</p>
          <div class="modal-meta">
            <span id="modalPrice">$0</span>
          </div>
        </div>
      </div>
    </div>

    <div id="fashionAssistantMount"></div>

    <footer class="site-footer">
      <div class="container footer-inner">
        <span>THE FASHION HUB / © <span id="year"></span></span>
        <span>Designed for confident dressing.</span>
        <a href="mailto:ethantawana26@gmail.com">Contact</a>
      </div>
    </footer>
  </body>
</html>
